type Query {
    issues: [Issue!]!
    customers: CustomerConnection!
}

enum IssueState {
    OPEN
    CLOSED
}

type Issue {
    id: ID!
    title: String!
    state: IssueState!
    project: Project!
    assignee: Account!
}

scalar AccountId

type Account {
    id: AccountId!
    name: String!
}

type Project {
    id: ID!
    name: String!
}

type CustomerConnection {
    edges: [CustomerEdge!]!
}

type CustomerEdge {
    node: Customer!
}

type Customer {
    id: Int!
    name: String!
    country: String!
    tier: CustomerTier!
}

enum CustomerTier {
    GOLD
    SILVER
}
