type Query {
    projects: [Project!]!
    issues: [Issue!]!
    customers: CustomerConnection!
    labels: [Label!]!
}

type Project {
    id: ID!
    name: String!
}

scalar IssueId

type Issue {
    id: IssueId!
    name: String!
}

type CustomerConnection {
    edges: [CustomerEdge!]!
}

type CustomerEdge {
    node: Customer!
}

type Customer {
    id: Int!
    name: String!
}

scalar LabelCode

enum LabelStatus {
    OPEN
    CLOSED
}

type Label {
    code: LabelCode!
    status: LabelStatus!
    name: String!
}
