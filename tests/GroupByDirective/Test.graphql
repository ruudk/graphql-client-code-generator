query Test {
    issuesByState: issues @groupBy(field: "state") {
        id
        title
        state
    }
    issuesByProject: issues @groupBy(field: "project.id") {
        id
        title
        project {
            id
            name
        }
    }
    customers {
        edges @groupBy(field: "node.country") {
            node {
                id
                name
                country
            }
        }
    }
}
